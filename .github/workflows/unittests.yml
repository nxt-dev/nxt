name: Unittests

on:
  workflow_dispatch:
    branches-ignore: [release]
  workflow_call:
    inputs:
      QT_DEPENDENCIES:
        description: 'Set to true to install Qt dependencies (Linux)'
        required: false
        default: 'false'
        type: string
  pull_request:
    branches-ignore: [release]
  push:
    branches-ignore: [release]

jobs:
  test-python:
    env:
      QT_DEPENDENCIES: ${{ inputs.QT_DEPENDENCIES }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.11 is Unreal 5.5-5.8 and Maya 2025/2026, 3.13 is Maya 2027.
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
      fail-fast: true
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Determine nxt-core branch to use
      run: |
        # Our forks test against our nxt on our branches; anything else
        # keeps using upstream, so this workflow still suits both.
        case "${{ github.repository_owner }}" in
          squarebit-studios)
            echo "NXT_CORE_REPO=squarebit-studios/nxt" >> $GITHUB_ENV
            if [ "${{ github.ref_name }}" = "sb_release" ]; then
              echo "NXT_CORE_BRANCH=sb_release" >> $GITHUB_ENV
            else
              echo "NXT_CORE_BRANCH=sb_dev" >> $GITHUB_ENV
            fi
            ;;
          *)
            echo "NXT_CORE_REPO=nxt-dev/nxt" >> $GITHUB_ENV
            if [ "${{ github.ref_name }}" = "release" ]; then
              echo "NXT_CORE_BRANCH=release" >> $GITHUB_ENV
            else
              echo "NXT_CORE_BRANCH=dev" >> $GITHUB_ENV
            fi
            ;;
        esac
      shell: bash

    - name: Install Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux' && env.QT_DEPENDENCIES == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libxkbcommon-x11-0 \
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
          libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
          libxcb-randr0 libxcb-xinerama0 libxcb-util1 \
          libegl1 \
          qtbase5-dev qtbase5-dev-tools \
          libqt5gui5 libqt5widgets5 libqt5core5a \
          xvfb

    - name: Ensure PIP
      run: python -m ensurepip --upgrade

    # Only the editor needs core installed separately; the core repo is
    # already the thing under test. The old check was against the full
    # nxt-dev/nxt path, so a fork of core failed to recognise itself and
    # tried to pip install itself from git.
    - name: Install nxt-core
      if: ${{ !endsWith(github.repository, '/nxt') }}
      shell: bash
      env:
        # Private repos need a credential to clone. Passed down by the
        # caller's `secrets: inherit`; empty here means public, which is
        # still true for nxt-dev.
        GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
      run: |
        if [ -n "$GIT_TOKEN" ]; then
          url="https://x-access-token:$GIT_TOKEN@github.com/$NXT_CORE_REPO.git"
        else
          url="https://github.com/$NXT_CORE_REPO.git"
        fi
        pip install "git+$url@$NXT_CORE_BRANCH"

    - name: Install this package
      run: pip install .

    - name: Run tests with xvfb (Ubuntu + Qt)
      if: runner.os == 'Linux' && env.QT_DEPENDENCIES == 'true'
      run: |
        xvfb-run -s "-screen 0 1024x768x24" python -m nxt.cli test

    - name: Run Unittests from CLI
      if: env.QT_DEPENDENCIES != 'true'
      run: python -m nxt.cli test
