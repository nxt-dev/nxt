name: Runner check

# Temporary. Asks for the same runner the release wants and does nothing
# else, so we can see whether the job is offered a runner at all without
# writing anything to the packages path.
on:
  workflow_dispatch:

jobs:
  can-we-get-a-runner:
    runs-on: [ self-hosted, macOS ]
    steps:
      - name: Say hello
        run: |
          echo "runner: $RUNNER_NAME"
          echo "os: $RUNNER_OS"
          echo "packages root: ${SB_PACKAGES_ROOT:-<unset>}"
          which rez || echo "rez not on PATH in this shell"
